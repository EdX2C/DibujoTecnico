<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1122" height="793" viewBox="0 0 1122 793">
  <defs>
    <pattern id="hatch45" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#333" stroke-width="0.8"/>
    </pattern>
    <mask id="annulusMask">
      <rect width="1122" height="793" fill="#000"/>
      <circle cx="820" cy="250" r="60" fill="#fff"/>
      <circle cx="820" cy="250" r="27" fill="#000"/>
    </mask>
  </defs>

  <rect width="1122" height="793" fill="#fff"/>
  <rect x="28" y="28" width="1066" height="737" fill="none" stroke="#222" stroke-width="1.5"/>
  <text x="48" y="58" font-family="Arial, sans-serif" font-size="16" fill="#111">Dibujo t&#233;cnico &#8212; Ejercicio: corte girado o abatido</text>
  <text x="48" y="82" font-family="Arial, sans-serif" font-size="12" fill="#444">Pieza: buje con agujero pasante &#183; Escala 1:1 sugerida &#183; Cotas en mm</text>

  <!-- A. Vista exterior y plano de corte -->
  <text x="48" y="125" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#111">A. Vista exterior + plano de corte A&#8211;A</text>
  <g transform="translate(70,190)">
    <line x1="-20" y1="60" x2="450" y2="60" stroke="#666" stroke-width="1" stroke-dasharray="10 4 2 4"/>
    <rect x="0" y="0" width="430" height="120" fill="none" stroke="#222" stroke-width="2.4"/>
    <line x1="0" y1="33" x2="430" y2="33" stroke="#666" stroke-width="1" stroke-dasharray="6 4"/>
    <line x1="0" y1="87" x2="430" y2="87" stroke="#666" stroke-width="1" stroke-dasharray="6 4"/>

    <line x1="215" y1="-38" x2="215" y2="158" stroke="#c45c12" stroke-width="1.8" stroke-dasharray="12 5 2 5"/>
    <line x1="207" y1="-38" x2="223" y2="-38" stroke="#c45c12" stroke-width="5"/>
    <line x1="207" y1="158" x2="223" y2="158" stroke="#c45c12" stroke-width="5"/>
    <path d="M182,-26 L213,-26 M213,-26 L203,-33 M213,-26 L203,-19" stroke="#0a8a7a" stroke-width="2" fill="none"/>
    <path d="M182,146 L213,146 M213,146 L203,139 M213,146 L203,153" stroke="#0a8a7a" stroke-width="2" fill="none"/>
    <text x="230" y="-43" font-family="Arial, sans-serif" font-size="16" fill="#c45c12">A</text>
    <text x="230" y="181" font-family="Arial, sans-serif" font-size="16" fill="#c45c12">A</text>
  </g>

  <!-- B. Resultado abatido sobre la vista -->
  <text x="620" y="125" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#111">B. Secci&#243;n abatida superpuesta</text>
  <g transform="translate(620,190)">
    <line x1="-20" y1="60" x2="420" y2="60" stroke="#666" stroke-width="1" stroke-dasharray="10 4 2 4"/>
    <rect x="0" y="0" width="400" height="120" fill="none" stroke="#222" stroke-width="2.4"/>
    <line x1="0" y1="33" x2="400" y2="33" stroke="#777" stroke-width="1" stroke-dasharray="6 4"/>
    <line x1="0" y1="87" x2="400" y2="87" stroke="#777" stroke-width="1" stroke-dasharray="6 4"/>
  </g>
  <circle cx="820" cy="250" r="60" fill="url(#hatch45)" mask="url(#annulusMask)"/>
  <circle cx="820" cy="250" r="60" fill="none" stroke="#222" stroke-width="1.2"/>
  <circle cx="820" cy="250" r="27" fill="#fff" stroke="#222" stroke-width="1.2"/>
  <line x1="748" y1="250" x2="892" y2="250" stroke="#777" stroke-width="0.8" stroke-dasharray="10 4 2 4"/>
  <line x1="820" y1="178" x2="820" y2="322" stroke="#777" stroke-width="0.8" stroke-dasharray="10 4 2 4"/>
  <text x="820" y="344" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#111">Corte A&#8211;A &#183; secci&#243;n abatida</text>

  <!-- Lectura guiada, envuelta para no invadir el borde -->
  <text x="48" y="385" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#111">Lectura t&#233;cnica</text>
  <text x="48" y="408" font-family="Arial, sans-serif" font-size="11" fill="#444">
    <tspan x="48" dy="0">La traza A&#8211;A se indica con la convenci&#243;n del curso: trazo y punto, extremos engrosados,</tspan>
    <tspan x="48" dy="18">letras A y flechas perpendiculares que apuntan en el mismo sentido de observaci&#243;n.</tspan>
    <tspan x="48" dy="24">La secci&#243;n gira 90&#176; alrededor de la traza hasta quedar paralela al plano de proyecci&#243;n. Su contorno es fino.</tspan>
    <tspan x="48" dy="18">El rayado a 45&#176; ocupa solo la corona de material; el agujero permanece limpio.</tspan>
  </text>

  <text x="48" y="505" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#111">Cotas sugeridas</text>
  <text x="48" y="528" font-family="Arial, sans-serif" font-size="11" fill="#333">Longitud 100 &#183; &#216; exterior 40 &#183; &#216; agujero 18 &#183; pared 11</text>

  <text x="48" y="570" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#111">Justificaci&#243;n</text>
  <text x="48" y="593" font-family="Arial, sans-serif" font-size="11" fill="#333">
    <tspan x="48" dy="0">El buje es alargado y de perfil constante; un corte total repetir&#237;a informaci&#243;n.</tspan>
    <tspan x="48" dy="18">La secci&#243;n abatida muestra la corona en verdadera magnitud sin a&#241;adir otra proyecci&#243;n.</tspan>
    <tspan x="48" dy="18">Se identifica como Corte A&#8211;A para cumplir la consigna de la asignatura.</tspan>
  </text>

  <text x="48" y="690" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#111">Control final</text>
  <text x="48" y="713" font-family="Arial, sans-serif" font-size="11" fill="#333">
    <tspan x="48" dy="0">&#9744; vista exterior &#183; &#9744; plano A&#8211;A &#183; &#9744; flechas &#183; &#9744; giro 90&#176;</tspan>
    <tspan x="48" dy="18">&#9744; contorno fino &#183; &#9744; rayado solo en material &#183; &#9744; identificaci&#243;n</tspan>
  </text>

  <!-- Cajetín: última fila completa para evitar desbordes -->
  <rect x="722" y="615" width="352" height="130" fill="none" stroke="#222" stroke-width="1.2"/>
  <line x1="722" y1="650" x2="1074" y2="650" stroke="#222"/>
  <line x1="722" y1="685" x2="1074" y2="685" stroke="#222"/>
  <line x1="722" y1="720" x2="1074" y2="720" stroke="#222"/>
  <line x1="898" y1="615" x2="898" y2="720" stroke="#222"/>
  <text x="732" y="638" font-family="Arial, sans-serif" font-size="11">Grupo / matr&#237;culas</text>
  <text x="908" y="638" font-family="Arial, sans-serif" font-size="11">Fecha</text>
  <text x="732" y="673" font-family="Arial, sans-serif" font-size="10">Tema: corte girado o abatido</text>
  <text x="908" y="673" font-family="Arial, sans-serif" font-size="10">Escala 1:1</text>
  <text x="732" y="708" font-family="Arial, sans-serif" font-size="10">Pieza: buje &#216;40 &#215; 100</text>
  <text x="908" y="708" font-family="Arial, sans-serif" font-size="10">Hoja 1/1</text>
  <text x="732" y="739" font-family="Arial, sans-serif" font-size="10">Corte A&#8211;A &#183; secci&#243;n abatida superpuesta</text>
</svg>
